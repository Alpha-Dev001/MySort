appId: com.mysort.desktop
productName: MySort
copyright: Copyright © 2026 MySort
directories:
  output: dist
  buildResources: assets
files:
  - out/**/*
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
npmRebuild: true
artifactName: MySort-Setup.exe
win:
  # Generated from logo.svg by scripts/generate-icons.mjs; the .ico carries
  # 16..256 px so the shell picks the right size for the taskbar, the installer
  # list and the Start menu.
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MySort
  uninstallDisplayName: MySort
  deleteAppDataOnUninstall: false
